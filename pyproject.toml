[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lark-toolkit"
version = "0.1.0"
description = "Modular Python utilities for Lark/Feishu API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Carl", email = "adam429.lee@gmail.com" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
